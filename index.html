<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Story Stick</title>
  <meta name="description" content="A calculator that works in feet, inches and sixteenths. Type 3′ 7-5/16″ + 11 3/8″ and get 4′ 6-11/16″, worked out exactly and read like a tape. Plus shop tools: even spacing for balusters, dividing a board, stairs, miters and crown, board feet, right triangles and square, and converting fractions to millimetres.">
  <meta property="og:title" content="Story Stick">
  <meta property="og:description" content="A calculator that works in feet, inches and sixteenths.">
  <meta property="og:image" content="https://junkdrawer.works/story-stick/og.png">
  <meta property="og:url" content="https://junkdrawer.works/story-stick/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ecebe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">
      <img src="icon.svg" alt="" width="32" height="32">
      <span>Story Stick</span>
    </a>
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <div class="bar-end">
      <button type="button" class="bar-btn tools" id="toolsBtn" aria-haspopup="dialog"><span class="now">Calculator</span><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button type="button" class="bar-btn icon" id="settingsBtn" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M10.3 2.5h3.4l.5 2.6a7.6 7.6 0 0 1 1.9 1.1l2.5-.9 1.7 3-2 1.7a7.7 7.7 0 0 1 0 2.2l2 1.7-1.7 3-2.5-.9a7.6 7.6 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.6 7.6 0 0 1-1.9-1.1l-2.5.9-1.7-3 2-1.7a7.7 7.7 0 0 1 0-2.2l-2-1.7 1.7-3 2.5.9a7.6 7.6 0 0 1 1.9-1.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    </div>
  </header>
  <div class="blade" id="blade" aria-hidden="true"></div>

  <main id="app" tabindex="-1"></main>

  <noscript><p class="noscript">Story Stick needs JavaScript to do the arithmetic.</p></noscript>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-body"></div>
  </dialog>
</body>
</html>
